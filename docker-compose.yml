# =============================================================================
# my-feeds — production-oriented base stack.
#
# `docker compose up` also loads docker-compose.override.yml, which switches
# the backend/frontend to hot-reloading dev servers. To run the production
# stack as defined here, ignore the override explicitly:
#
#     docker compose -f docker-compose.yml up --build
#
# Copy .env.example to .env to customise ports/credentials (all optional).
# =============================================================================
name: my-feeds

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-myfeeds}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-myfeeds}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - myfeeds

  # One-shot service: applies Alembic migrations, then exits. The backend waits
  # for this to complete successfully before it starts.
  migrate:
    image: my-feeds-backend:prod
    build:
      context: ./backend
      target: prod
    command: [ "alembic", "upgrade", "head" ]
    restart: "no"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-myfeeds}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - myfeeds

  backend:
    image: my-feeds-backend:prod
    build:
      context: ./backend
      target: prod
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-myfeeds}
    # Optional: OAuth keys, Azure Speech, SECRET_KEY, etc. `environment`
    # values above take precedence over anything in this file.
    env_file:
      - path: ./backend/.env
        required: false
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    networks:
      - myfeeds

  frontend:
    image: my-feeds-frontend:prod
    build:
      context: ./frontend
      target: prod
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks:
      - myfeeds

volumes:
  postgres-data:

networks:
  myfeeds:
    driver: bridge
