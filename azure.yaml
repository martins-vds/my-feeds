# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: my-feeds
services:
  web:
    project: .
    language: docker
    host: appservice
    docker:
      path: Dockerfile
      remoteBuild: true
      buildArgs:
        - VITE_ALLOW_EXTERNAL_IMAGES=${ALLOW_EXTERNAL_IMAGES=false}
