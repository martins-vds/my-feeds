# =============================================================================
# my-feeds — development override (auto-merged on `docker compose up`).
#
# Turns the backend/frontend into hot-reloading dev servers with the source
# tree bind-mounted into the containers:
#   backend  -> quart run --reload   (http://localhost:5000)
#   frontend -> vite dev server      (http://localhost:5173)
#
# Postgres and the one-shot Alembic `migrate` service are inherited unchanged
# from docker-compose.yml.
# =============================================================================
services:
  migrate:
    image: my-feeds-backend:dev
    build:
      target: dev
    volumes:
      - ./backend:/app

  backend:
    image: my-feeds-backend:dev
    build:
      target: dev
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
      # Poll files for changes so hypercorn's --reload detects edits on the
      # bind mount (WSL2/Docker filesystem events don't cross it reliably).
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./backend:/app

  frontend:
    image: my-feeds-frontend:dev
    build:
      target: dev
    environment:
      VITE_API_URL: /api
      VITE_PROXY_TARGET: http://backend:5000
      # Poll for file changes so Vite HMR works on the bind mount (WSL2/Docker).
      VITE_USE_POLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    # Replace (not append to) the base nginx port mapping with the Vite port.
    # Override FRONTEND_DEV_PORT in .env if 5173 is already in use locally.
    ports: !override
      - "${FRONTEND_DEV_PORT:-5173}:5173"

volumes:
  frontend-node-modules:
