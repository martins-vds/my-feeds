# The official nginx entrypoint substitutes only ALLOW_EXTERNAL_IMAGES.
# No request header may enable external image loading.
map "${ALLOW_EXTERNAL_IMAGES}" $image_sources {
    default "'self' data:";
    "true" "'self' data: https:";
}

log_format privacy '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # Never log OAuth query parameters, Referer, cookies or request bodies.
    access_log /dev/stdout privacy;
    error_log /dev/stderr crit;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src $image_sources; connect-src 'self'; font-src 'self'; media-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /assets/ {
        expires 1y;
        # expires adds Cache-Control without disabling inherited security headers.
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        # Backend uses its configured HTTPS public URL, not untrusted forwarding headers.
        proxy_set_header X-Forwarded-Proto $scheme;
        # A stale upstream CSP must not widen or conflict with the SPA policy.
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Strict-Transport-Security;
    }

    location = /health {
        proxy_pass http://backend:5000/health;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
